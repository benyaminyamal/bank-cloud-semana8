server:
  port: 8081

spring:
  application:
    name: accounts-service

app:
  data:
    semana: ${APP_DATA_SEMANA:semana_3}
  jwt:
    issuer: ${APP_JWT_ISSUER:http://localhost:9000}
    jwk-set-uri: ${APP_JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    eureka:
      enabled: false
