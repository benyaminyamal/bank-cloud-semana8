server:
  port: 8093
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: bff

spring:
  application:
    name: bff-atm
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

app:
  jwt:
    issuer: ${APP_JWT_ISSUER:http://localhost:9000}
    jwk-set-uri: ${APP_JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  auth:
    token-uri: ${APP_AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}
    client-id: bff-internal
    client-secret: bff-internal-secret
    scope: accounts.read payments.write

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    secure-port-enabled: true
    non-secure-port-enabled: false
    secure-port: ${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

resilience4j:
  circuitbreaker:
    instances:
      accounts-service:
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      payments-service:
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      accounts-service:
        timeout-duration: 5s
      payments-service:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    eureka:
      enabled: false
