x-java: &java
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
  APP_JWT_ISSUER: http://localhost:9000
  APP_JWT_JWK_SET_URI: http://auth-service:9000/oauth2/jwks

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

x-kafka: &kafka
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

x-kafka-health: &kafka-health
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
  interval: 10s
  timeout: 10s
  retries: 18
  start_period: 40s

services:
  kafka-1:
    image: apache/kafka:3.9.1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    healthcheck: *kafka-health

  kafka-2:
    image: apache/kafka:3.9.1
    hostname: kafka-2
    environment:
      <<: *kafka
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    healthcheck: *kafka-health

  kafka-3:
    image: apache/kafka:3.9.1
    hostname: kafka-3
    environment:
      <<: *kafka
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    healthcheck: *kafka-health

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  discovery-service:
    build:
      context: .
      target: discovery
    ports:
      - "8761:8761"
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]

  auth-service:
    build:
      context: .
      target: auth
    environment:
      <<: *java
    ports:
      - "9000:9000"
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/actuator/health"]

  accounts-service:
    build:
      context: .
      target: accounts
    environment:
      <<: *java
    ports:
      - "8081:8081"
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]

  transactions-service:
    build:
      context: .
      target: transactions
    environment:
      <<: *java
      APP_AUTH_TOKEN_URI: http://auth-service:9000/oauth2/token
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_KAFKA_PRODUCER_ACKS: all
    ports:
      - "8082:8082"
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]

  notification-service:
    build:
      context: .
      target: notification
    environment:
      <<: *java
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "8083:8083"
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]

  gateway-service:
    build:
      context: .
      target: gateway
    environment:
      <<: *java
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
      transactions-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
